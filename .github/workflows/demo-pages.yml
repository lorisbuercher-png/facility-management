name: Öffentliche Landingpage veröffentlichen (nur statische Dateien)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5

      - name: Nur öffentliche Landingpage verpacken
        env:
          REPOSITORY: ${{ github.event.repository.name }}
        run: |
          python3 - <<'PY'
          import html
          import os
          import shutil
          from pathlib import Path

          source = Path("public")
          target = Path("_site")
          target.mkdir(exist_ok=True)
          base = "/" + os.environ["REPOSITORY"] + "/"

          # ALLOWLIST: never copy public/demo.html, any *.js, private app
          # sources, tenant data, internal images or API implementation.
          shutil.copyfile(source / "landing.html", target / "index.html")
          shutil.copyfile(source / "landing.css", target / "landing.css")

          # Old demo URLs must never fall through to the application.
          # GitHub Pages serves this inert page with HTTP 404.
          page = (
            '<!doctype html><html lang="de-CH"><head><meta charset="utf-8">'
            '<meta name="viewport" content="width=device-width,initial-scale=1">'
            '<meta name="robots" content="noindex,nofollow">'
            '<meta http-equiv="Content-Security-Policy" content="default-src \'none\'; style-src \'self\'; base-uri \'none\'; form-action \'none\'">'
            '<title>Seite nicht verfügbar</title>'
            '<link rel="stylesheet" href="' + base + 'landing.css">'
            '</head><body><main class="not-found"><h1>Diese Seite ist nicht öffentlich verfügbar.</h1>'
            '<p>Hier findest du ausschliesslich Informationen zur Plattform.</p>'
            '<a class="primary-link" href="' + base + '">Zur Startseite</a>'
            '</main></body></html>'
          )
          (target / "404.html").write_text(page, encoding="utf-8")
          (target / ".nojekyll").touch()

          expected = {".nojekyll", "index.html", "landing.css", "404.html"}
          actual = {p.name for p in target.rglob("*") if p.is_file()}
          assert actual == expected, "Unexpected files in public deployment: " + repr(actual)
          published = (target / "index.html").read_text(encoding="utf-8").lower()
          for forbidden in ["demo.html", "carglass", "<script", "<form", "/api/", "signin", "auth_token"]:
            assert forbidden not in published, "Unexpected public content: " + forbidden
          print("PASS: marketing-only deployment; no demo, JS, customer assets or API code")
          PY

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Landingpage veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
